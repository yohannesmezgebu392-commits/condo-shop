<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የሱቅ አስተዳዳሪ | ዳሽቦርድ እና የሂሳብ መዝገብ</title>
  <style>
    :root {
      --primary: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0b1329;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 16px;
      text-align: center;
    }
    header h1 { font-size: 1.25rem; color: var(--primary); }
    header p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

    .container { max-width: 540px; margin: 0 auto; padding: 14px; }

    /* Summary Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
    }
    .summary-title { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 6px; }
    .summary-val { font-size: 1.05rem; font-weight: 800; }
    .val-income { color: #34d399; }
    .val-expense { color: #f87171; }
    .val-balance { color: #38bdf8; }

    /* Export to Excel Button */
    .btn-export {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--card-inner);
      padding: 5px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    /* Card & Forms */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
    input, select {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
    }
    .btn-action {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Transactions List */
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .item-row:last-child { border-bottom: none; }
    .item-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .del-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: none;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>የሱቅ አስተዳዳሪ ዳሽቦርድ</h1>
    <p>የእለት ተእለት ገቢ፣ ወጪ እና የትርፍ መቆጣጠሪያ</p>
  </header>

  <div class="container">
    
    <!-- ማጠቃለያ ካርዶች -->
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-title">ጠቅላላ ገቢ</div>
        <div class="summary-val val-income" id="totalIncome">0 ብር</div>
      </div>
      <div class="summary-card">
        <div class="summary-title">ጠቅላላ ወጪ</div>
        <div class="summary-val val-expense" id="totalExpense">0 ብር</div>
      </div>
      <div class="summary-card">
        <div class="summary-title">ቀሪ ጥሬ ገንዘብ</div>
        <div class="summary-val val-balance" id="netBalance">0 ብር</div>
      </div>
    </div>

    <!-- ወደ Excel ማውረጃ ቁልፍ -->
    <button class="btn-export" onclick="exportToExcel()">📊 የዕለቱን ሂሳብ በ Excel አውርድ (Save to CSV)</button>

    <!-- ታቦች -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('finance')">💰 ወጪና ገቢ መዝግብ</button>
      <button class="tab-btn" onclick="switchTab('list')">📋 የተመዘገቡ ዝርዝሮች</button>
    </div>

    <!-- ክፍል 1፡ ወጪና ገቢ መመዝገቢያ -->
    <div id="tabFinance" class="card">
      <form id="financeForm" onsubmit="addTransaction(event)">
        <div class="form-group">
          <label>የግብይት አይነት</label>
          <select id="tType" required>
            <option value="income">ገቢ (+) (የቀኑ ሽያጭ)</option>
            <option value="expense">ወጪ (-) (የእቃ ግዢ፣ ሌላ ወጪ)</option>
          </select>
        </div>
        <div class="form-group">
          <label>ዝርዝር መግለጫ</label>
          <input type="text" id="tTitle" placeholder="ምሳሌ፦ የጠዋት ሽያጭ፣ የዳቦ ግዢ..." required>
        </div>
        <div class="form-group">
          <label>የገንዘብ መጠን (ብር)</label>
          <input type="number" id="tAmount" placeholder="ምሳሌ፦ 500" required>
        </div>
        <button type="submit" class="btn-action">+ መዝግብ</button>
      </form>
    </div>

    <!-- ክፍል 2፡ የዝርዝር ማሳያ -->
    <div id="tabList" class="card" style="display: none;">
      <div id="transactionsList"></div>
    </div>

  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('condo_shop_finance') || '[]');

    function saveAndRender() {
      localStorage.setItem('condo_shop_finance', JSON.stringify(transactions));
      renderSummary();
      renderList();
    }

    function addTransaction(e) {
      e.preventDefault();
      const type = document.getElementById('tType').value;
      const title = document.getElementById('tTitle').value.trim();
      const amount = parseFloat(document.getElementById('tAmount').value);

      if (!title || isNaN(amount)) return;

      const dateStr = new Date().toLocaleDateString('am-ET') + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

      transactions.unshift({
        id: Date.now(),
        type,
        title,
        amount,
        date: dateStr
      });

      document.getElementById('financeForm').reset();
      saveAndRender();
      alert("✅ መረጃው በተሳካ ሁኔታ ተመዝግቧል!");
    }

    function deleteTx(id) {
      if (confirm("እርግጠኛ ነዎት ይህ መረጃ ይሰረዝ?")) {
        transactions = transactions.filter(t => t.id !== id);
        saveAndRender();
      }
    }

    function renderSummary() {
      let income = 0;
      let expense = 0;

      transactions.forEach(t => {
        if (t.type === 'income') income += t.amount;
        if (t.type === 'expense') expense += t.amount;
      });

      document.getElementById('totalIncome').innerText = income.toLocaleString() + ' ብር';
      document.getElementById('totalExpense').innerText = expense.toLocaleString() + ' ብር';
      document.getElementById('netBalance').innerText = (income - expense).toLocaleString() + ' ብር';
    }

    function renderList() {
      const container = document.getElementById('transactionsList');
      if (transactions.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">ምንም የተመዘገበ መረጃ የለም።</div>';
        return;
      }

      container.innerHTML = transactions.map(t => `
        <div class="item-row">
          <div>
            <div style="font-weight: 700; font-size: 0.92rem;">${t.title}</div>
            <div class="item-meta">${t.date}</div>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-weight: 800; color: ${t.type === 'income' ? '#34d399' : '#f87171'}">
              ${t.type === 'income' ? '+' : '-'}${t.amount.toLocaleString()} ብር
            </span>
            <button class="del-btn" onclick="deleteTx(${t.id})">አጥፋ</button>
          </div>
        </div>
      `).join('');
    }

    function switchTab(tab) {
      const btns = document.querySelectorAll('.tab-btn');
      btns.forEach(b => b.classList.remove('active'));

      if (tab === 'finance') {
        btns[0].classList.add('active');
        document.getElementById('tabFinance').style.display = 'block';
        document.getElementById('tabList').style.display = 'none';
      } else {
        btns[1].classList.add('active');
        document.getElementById('tabFinance').style.display = 'none';
        document.getElementById('tabList').style.display = 'block';
      }
    }

    // ወደ Excel / CSV ፋይል ቀይሮ ማውረጃ
    function exportToExcel() {
      if (transactions.length === 0) {
        alert("የሚወርድ ምንም የተመዘገበ ሂሳብ የለም!");
        return;
      }

      let csvContent = "\uFEFFቀንና ሰዓት,ዝርዝር መግለጫ,አይነት,መጠን (ብር)\n";
      transactions.forEach(t => {
        const typeText = t.type === 'income' ? 'ገቢ' : 'ወጪ';
        csvContent += `"${t.date}","${t.title}","${typeText}",${t.amount}\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `የሱቅ_የሂሳብ_መዝገብ_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // የመጀመሪያ ጅምር
    saveAndRender();
  </script>
</body>
</html>
