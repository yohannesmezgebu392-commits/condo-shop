
      <!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የሱቅ አስተዳዳሪ | ወጪ፣ ቀሪ እና እቃዎች</title>
  <style>
    :root {
      --primary: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0b1329;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 60px; }

    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 16px;
      text-align: center;
    }
    header h1 { font-size: 1.25rem; color: var(--primary); }
    header p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

    .container { max-width: 540px; margin: 0 auto; padding: 14px; }

    /* Summary Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
    }
    .summary-title { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 6px; }
    .summary-val { font-size: 1.05rem; font-weight: 800; }
    .val-income { color: #34d399; }
    .val-expense { color: #f87171; }
    .val-balance { color: #38bdf8; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--card-inner);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Card & Forms */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.76rem; color: var(--text-muted); margin-bottom: 4px; }
    input, select {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-danger { background: var(--danger); }

    /* List Display */
    .item-list { list-style: none; margin-top: 10px; }
    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-inner);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .row-info h4 { font-size: 0.88rem; font-weight: 700; }
    .row-info p { font-size: 0.75rem; color: var(--text-muted); }
    .row-actions { display: flex; align-items: center; gap: 8px; }
    .btn-del {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚙️ የሱቅ አስተዳዳሪ ፓነል</h1>
    <p>የዕለቱ ሽያጭ፣ ወጪዎች እና የዕቃ ዝርዝር መቆጣጠሪያ</p>
  </header>

  <div class="container">

    <!-- Overview Stats -->
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-title">ጠቅላላ ሽያጭ (ገቢ)</div>
        <div class="summary-val val-income" id="totalIncome">0 ብር</div>
      </div>
      <div class="summary-card">
        <div class="summary-title">ጠቅላላ ወጪ</div>
        <div class="summary-val val-expense" id="totalExpense">0 ብር</div>
      </div>
      <div class="summary-card">
        <div class="summary-title">ቀሪ ጥሬ ገንዘብ</div>
        <div class="summary-val val-balance" id="netBalance">0 ብር</div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('cashflow')">💰 ወጪ እና ገቢ</button>
      <button class="tab-btn" onclick="switchTab('inventory')">📦 አዲስ ዕቃ መጨመሪያ</button>
    </div>

    <!-- TAB 1: CASHFLOW & EXPENSES -->
    <div id="cashflow" class="tab-content active">
      <div class="card">
        <div class="card-title">➕ የገንዘብ እንቅስቃሴ መዝግብ</div>
        <form id="cashForm" onsubmit="addCashRecord(event)">
          <div class="form-group">
            <label>ዓይነት</label>
            <select id="recordType">
              <option value="expense">ወጪ (ለምሳሌ፡ ለጅምላ እቃ፣ ትራንስፖርት...)</option>
              <option value="income">ገቢ (የዕለቱ ጥሬ ሽያጭ)</option>
            </select>
          </div>
          <div class="form-group">
            <label>የገንዘብ መጠን (ብር)</label>
            <input type="number" id="recordAmount" placeholder="ምሳሌ፦ 500" required>
          </div>
          <div class="form-group">
            <label>ምክንያት / ማብራሪያ</label>
            <input type="text" id="recordDesc" placeholder="ምሳሌ፦ የዘይት እና ስኳር ግዢ" required>
          </div>
          <button type="submit" class="btn">መዝግብ</button>
        </form>
      </div>

      <div class="card">
        <div class="card-title">📋 የቅርብ ጊዜ ወጪና ገቢ ታሪክ</div>
        <ul class="item-list" id="recordsList"></ul>
      </div>
    </div>

    <!-- TAB 2: INVENTORY MANAGEMENT -->
    <div id="inventory" class="tab-content">
      <div class="card">
        <div class="card-title">🛍️ አዲስ ዕቃ ወደ ሱቁ ጨምር</div>
        <form id="itemForm" onsubmit="addNewProduct(event)">
          <div class="form-group">
            <label>የዕቃው ስም</label>
            <input type="text" id="itemName" placeholder="ምሳሌ፦ የታሸገ ወተት" required>
          </div>
          <div class="form-group">
            <label>ዋጋ (በብር)</label>
            <input type="text" id="itemPrice" placeholder="ምሳሌ፦ 85 ብር" required>
          </div>
          <div class="form-group">
            <label>ምልክት / ኢሞጂ (Icon)</label>
            <input type="text" id="itemIcon" placeholder="ምሳሌ፦ 🥛 ወይም 🍞" value="📦">
          </div>
          <button type="submit" class="btn">ዕቃውን ጨምር</button>
        </form>
      </div>

      <div class="card">
        <div class="card-title">📦 በሱቁ ውስጥ ያሉ ዕቃዎች</div>
        <ul class="item-list" id="productsList"></ul>
      </div>
    </div>

  </div>

  <script>
    // Tab Switcher
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    // Cashflow Storage
    let records = JSON.parse(localStorage.getItem('shop_records')) || [];
    let customProducts = JSON.parse(localStorage.getItem('shop_products')) || [];

    function updateStats() {
      let income = 0;
      let expense = 0;

      records.forEach(r => {
        if (r.type === 'income') income += Number(r.amount);
        if (r.type === 'expense') expense += Number(r.amount);
      });

      document.getElementById('totalIncome').innerText = `${income.toLocaleString()} ብር`;
      document.getElementById('totalExpense').innerText = `${expense.toLocaleString()} ብር`;
      document.getElementById('netBalance').innerText = `${(income - expense).toLocaleString()} ብር`;

      renderRecords();
    }

    function addCashRecord(e) {
      e.preventDefault();
      const type = document.getElementById('recordType').value;
      const amount = document.getElementById('recordAmount').value;
      const desc = document.getElementById('recordDesc').value;
      const date = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

      records.unshift({ id: Date.now(), type, amount, desc, date });
      localStorage.setItem('shop_records', JSON.stringify(records));
      document.getElementById('cashForm').reset();
      updateStats();
    }

    function deleteRecord(id) {
      records = records.filter(r => r.id !== id);
      localStorage.setItem('shop_records', JSON.stringify(records));
      updateStats();
    }

    function renderRecords() {
      const list = document.getElementById('recordsList');
      if (records.length === 0) {
        list.innerHTML = `<li style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:10px;">እስካሁን የተመዘገበ የለም</li>`;
        return;
      }
      list.innerHTML = records.map(r => `
        <li class="list-row">
          <div class="row-info">
            <h4 style="color:${r.type === 'income' ? '#34d399' : '#f87171'}">
              ${r.type === 'income' ? '+ ' : '- '}${Number(r.amount).toLocaleString()} ብር
            </h4>
            <p>${r.desc} (${r.date})</p>
          </div>
          <div class="row-actions">
            <button class="btn-del" onclick="deleteRecord(${r.id})">አጥፋ</button>
          </div>
        </li>
      `).join('');
    }

    // Product Add
    function addNewProduct(e) {
      e.preventDefault();
      const name = document.getElementById('itemName').value;
      const price = document.getElementById('itemPrice').value;
      const icon = document.getElementById('itemIcon').value || '📦';

      customProducts.unshift({ id: Date.now(), name, price, icon });
      localStorage.setItem('shop_products', JSON.stringify(customProducts));
      document.getElementById('itemForm').reset();
      renderProducts();
      alert("✅ አዲስ ዕቃ በተሳካ ሁኔታ ተጨምሯል!");
    }

    function deleteProduct(id) {
      customProducts = customProducts.filter(p => p.id !== id);
      localStorage.setItem('shop_products', JSON.stringify(customProducts));
      renderProducts();
    }

    function renderProducts() {
      const list = document.getElementById('productsList');
      if (customProducts.length === 0) {
        list.innerHTML = `<li style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:10px;">ተጨማሪ ዕቃ አልተመዘገበም</li>`;
        return;
      }
      list.innerHTML = customProducts.map(p => `
        <li class="list-row">
          <div class="row-info">
            <h4>${p.icon} ${p.name}</h4>
            <p style="color:#34d399; font-weight:700;">${p.price}</p>
          </div>
          <div class="row-actions">
            <button class="btn-del" onclick="deleteProduct(${p.id})">አጥፋ</button>
          </div>
        </li>
      `).join('');
    }

    // Init
    updateStats();
    renderProducts();
  </script>
</body>
</html>
