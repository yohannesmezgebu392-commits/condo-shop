<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የኮንዶሚኒየም ፈጣን ማዘዣ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700;800&display=swap');

    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --warning: #f59e0b;
      --blue: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans Ethiopic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 16px 12px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    input, select, textarea {
      width: 100%;
      background: #0b1329;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #38bdf8;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .form-group {
      flex: 1;
    }

    .notice-urgent {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--warning);
      color: #fde68a;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      margin-top: 6px;
      display: none;
      font-weight: 600;
    }

    .payment-box {
      border: 1px dashed #38bdf8;
      background: rgba(2, 132, 199, 0.08);
      border-radius: 8px;
      padding: 14px;
      margin-top: 10px;
    }

    .pay-header {
      font-size: 0.85rem;
      color: #7dd3fc;
      font-weight: 700;
    }

    .pay-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .account-badge {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .account-number {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: white;
    }

    .btn-copy {
      background: var(--blue);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    .success-alert {
      display: none;
      background: #064e3b;
      border: 1px solid #059669;
      color: #a7f3d0;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 14px;
    }

    .divider-text {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin: 8px 0;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>የኮንዶሚኒየም ፈጣን ማዘዣ</h1>
      <p>ትዕዛዝዎን ይላኩ፤ በደቂቃዎች ውስጥ ደጃፍዎ እናደርሳለን</p>
    </div>

    <form id="orderForm">
      <!-- የእቃ መረጃ -->
      <div class="card">
        <div class="card-title">📦 የሚፈልጉት እቃ ዝርዝር</div>
        <div class="form-group">
          <label>የእቃው ስም</label>
          <input type="text" id="itemName" placeholder="ምሳሌ፦ እንጀራ፣ ዘይት፣ ውሃ..." required>
        </div>
        <div class="form-group">
          <label>ብዛት / መጠን</label>
          <input type="text" id="itemQty" placeholder="ምሳሌ፦ 5 ፍሬ ወይም 1 ሊትር" required>
        </div>
      </div>

      <!-- አድራሻ -->
      <div class="card">
        <div class="card-title">📍 የት ይድረስልዎ? (አድራሻ)</div>
        <div class="row">
          <div class="form-group">
            <label>ብሎክ</label>
            <input type="text" id="blockNo" placeholder="ምሳሌ፡ 7" required>
          </div>
          <div class="form-group">
            <label>ፎቅ (ደረጃ)</label>
            <input type="text" id="floorNo" placeholder="ምሳሌ፡ 3" required>
          </div>
          <div class="form-group">
            <label>የቤት ቁጥር</label>
            <input type="text" id="houseNo" placeholder="ምሳሌ፡ 12" required>
          </div>
        </div>
        <div class="form-group">
          <label>ስልክ ቁጥርዎ</label>
          <input type="tel" id="customerPhone" placeholder="ምሳሌ፡ 09..." required>
        </div>
      </div>

      <!-- ሰዓት እና ክፍያ -->
      <div class="card">
        <div class="card-title">⏰ ሰዓት እና የክፍያ አማራጭ</div>

        <div class="form-group">
          <label>ለስንት ሰዓት ይድረስልዎ?</label>
          <select id="deliveryTime" onchange="toggleUrgentNotice()">
            <option value="በጣም አጣዳፊ (በ15-20 ደቂቃ ውስጥ)" selected>በጣም አጣዳፊ (በ15-20 ደቂቃ ውስጥ)</option>
            <option value="መደበኛ (በ30-45 ደቂቃ ውስጥ)">መደበኛ (በ30-45 ደቂቃ ውስጥ)</option>
            <option value="በተወሰነ ሰዓት (ቀጠሮ)">በተወሰነ ሰዓት (ቀጠሮ)</option>
          </select>
          <div id="urgentNotice" class="notice-urgent">
            ⚡ ለአጣዳፊ ትዕዛዝ ለሱቁ +25 ብር ተጨማሪ የማድረሻ ክፍያ ይታሰባል።
          </div>
        </div>

        <div class="form-group">
          <label>በምን ይከፍላሉ?</label>
          <select id="paymentMethod" onchange="updatePaymentDetails()">
            <option value="Telebirr">ቴሌብር (Telebirr)</option>
            <option value="CBE">የኢትዮጵያ ንግድ ባንክ (CBE)</option>
            <option value="Cash">በእጅ (Cash on Delivery)</option>
          </select>
        </div>

        <!-- ዲጂታል ክፍያ ሳጥን -->
        <div id="paymentBox" class="payment-box">
          <div id="payHeader" class="pay-header">የቴሌብር ስልክ ቁጥር፦</div>
          <div id="paySub" class="pay-sub">የሂሳብ ስም፦ ዮሐንስ</div>

          <div class="account-badge">
            <span id="accountNumber" class="account-number">0948622684</span>
            <button type="button" class="btn-copy" onclick="copyAccount()">ኮፒ አድርግ 📋</button>
          </div>

          <div class="form-group">
            <label>የከፈሉበት ስክሪንሾት (ደረሰኝ) ካለ ያያይዙ፦</label>
            <input type="file" id="receiptFile" accept="image/*">
          </div>

          <div class="divider-text">ወይም (ፎቶ ካልያያዙ)</div>

          <div class="form-group">
            <label>የከፈሉበት Transaction ID / ሊንክ ያስገቡ፦</label>
            <input type="text" id="transactionId" placeholder="ምሳሌ፦ DH17G6OUOR ወይም የቴሌብር ሊንክ">
          </div>
        </div>

        <div class="form-group" style="margin-top: 12px;">
          <label>ተጨማሪ አስተያየት (ካለ)</label>
          <input type="text" id="orderNotes" placeholder="ምሳሌ፡ በሩን አንኳኩተው ይደውሉልኝ...">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">ትዕዛዝህን ላክ 🚀</button>
    </form>

    <div id="successAlert" class="success-alert">
      ✅ ትዕዛዝዎ በተሳካ ሁኔታ ተልኳል! እቃው በደቂቃዎች ውስጥ ይደርስዎታል።
    </div>
  </div>

  <script>
    const BOT_TOKEN = "8516306659:AAFhmw-kGsq2u2qQO1dZ_W1P8mC6Qy-pM1Q";
    const CHAT_ID = "1000111021841"; // የባለሱቁ ቴሌግራም መታወቂያ

    function toggleUrgentNotice() {
      const timeSelect = document.getElementById("deliveryTime").value;
      const notice = document.getElementById("urgentNotice");
      if (timeSelect.includes("በጣም አጣዳፊ")) {
        notice.style.display = "block";
      } else {
        notice.style.display = "none";
      }
    }

    function updatePaymentDetails() {
      const method = document.getElementById("paymentMethod").value;
      const box = document.getElementById("paymentBox");
      const header = document.getElementById("payHeader");
      const sub = document.getElementById("paySub");
      const acc = document.getElementById("accountNumber");

      if (method === "Telebirr") {
        box.style.display = "block";
        header.innerText = "የቴሌብር ስልክ ቁጥር፦";
        sub.innerText = "የሂሳብ ስም፦ ዮሐንስ";
        acc.innerText = "0948622684";
      } else if (method === "CBE") {
        box.style.display = "block";
        header.innerText = "የንግድ ባንክ አካውንት፦";
        sub.innerText = "የሂሳብ ስም፦ Yohannes Mezgebu";
        acc.innerText = "1000111021841";
      } else {
        box.style.display = "none";
      }
    }

    function copyAccount() {
      const acc = document.getElementById("accountNumber").innerText;
      navigator.clipboard.writeText(acc);
      alert("ቁጥሩ ኮፒ ተደርጓል: " + acc);
    }

    // ገጹ ሲከፈት የአጣዳፊ ማሳሰቢያውን አሳይ
    toggleUrgentNotice();

    document.getElementById("orderForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.innerText = "ትዕዛዙ እየተላከ ነው...";
      submitBtn.disabled = true;

      const itemName = document.getElementById("itemName").value;
      const itemQty = document.getElementById("itemQty").value;
      const blockNo = document.getElementById("blockNo").value;
      const floorNo = document.getElementById("floorNo").value;
      const houseNo = document.getElementById("houseNo").value;
      const phone = document.getElementById("customerPhone").value;
      const time = document.getElementById("deliveryTime").value;
      const payment = document.getElementById("paymentMethod").value;
      const notes = document.getElementById("orderNotes").value || "የለም";
      const txId = document.getElementById("transactionId").value || "አልተጠቀሰም";
      const receiptFile = document.getElementById("receiptFile").files[0];

      let urgentFeeText = time.includes("በጣም አጣዳፊ") ? "\n⚡ ተጨማሪ ክፍያ: +25 ብር (አጣዳፊ)" : "";

      let caption = `🛒 አዲስ ትዕዛዝ ደርሶዎታል!\n\n` +
                    `📦 እቃ: ${itemName}\n` +
                    `🔢 ብዛት: ${itemQty}\n\n` +
                    `📍 አድራሻ:\n` +
                    `• ብሎክ: ${blockNo}\n` +
                    `• ደረጃ: ${floorNo}\n` +
                    `• የቤት ቁጥር: ${houseNo}\n` +
                    `📞 ስልክ: ${phone}\n\n` +
                    `⏰ ሰዓት: ${time}${urgentFeeText}\n` +
                    `💳 ክፍያ: ${payment}\n` +
                    `🔗 Transaction ID/Link: ${txId}\n` +
                    `📝 ማስታወሻ: ${notes}`;

      try {
        if (receiptFile) {
          const formData = new FormData();
          formData.append("chat_id", CHAT_ID);
          formData.append("caption", caption);
          formData.append("photo", receiptFile);

          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: "POST",
            body: formData
          });
        } else {
          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: caption
            })
          });
        }

        document.getElementById("orderForm").style.display = "none";
        document.getElementById("successAlert").style.display = "block";
      } catch (err) {
        alert("ትዕዛዙን በመላክ ላይ ችግር ተፈጥሯል፤ እባክዎ በድጋሚ ይሞክሩ።");
        submitBtn.innerText = "ትዕዛዝህን ላክ 🚀";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
