      <!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የኮንዶሚኒየም ፈጣን ማዘዣ</title>
  <style>
    :root {
      --primary: #10b981;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 50px; }
    header {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: white;
      padding: 24px 20px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      text-align: center;
    }
    .container { max-width: 520px; margin: 0 auto; padding: 18px 14px; }
    .section-title { font-size: 1.05rem; font-weight: 700; margin: 16px 0 12px 2px; color: #38bdf8; }
    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .product-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .product-icon { font-size: 1.8rem; background: var(--card-inner); width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 12px; }
    .product-info { flex: 1; }
    .product-name { font-size: 0.9rem; font-weight: 700; }
    .product-price { font-size: 0.85rem; color: #34d399; font-weight: 700; }
    .btn-quick-add {
      width: 100%;
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 8px;
      padding: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .card-title { font-size: 0.98rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
    input, textarea, select {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
    }
    textarea { resize: vertical; min-height: 65px; }
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    #statusMessage {
      text-align: center;
      padding: 12px;
      margin-top: 14px;
      border-radius: 10px;
      font-weight: 700;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>የኮንዶሚኒየም ሱቅ</h1>
    <p>የእለት ተእለት ፍላጎትዎን ይዘዙ፤ በደቂቃዎች ውስጥ እናደርሳለን!</p>
  </header>

  <div class="container">
    <div class="section-title">🔥 ተወዳጅ እቃዎች (ነክተው ይጨምሩ)</div>
    <div class="product-grid" id="productGrid"></div>

    <form id="orderForm" onsubmit="handleOrder(event)">
      <div class="card">
        <div class="card-title">📝 የሚፈልጉት እቃ ዝርዝር</div>
        <div class="form-group">
          <label>የሚፈልጉት እቃ</label>
          <textarea id="items" placeholder="ለምሳሌ፦ 10 እንጀራ፣ 1 ኪሎ ምስር..." required></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>ጠቅላላ ብዛት</label>
            <input type="text" id="quantity" placeholder="ምሳሌ፦ 10 ፍሬ" required>
          </div>
          <div class="form-group">
            <label>የተገመተ ዋጋ (ብር)</label>
            <input type="text" id="estimatedPrice" placeholder="ምሳሌ፦ 300 ብር">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📍 የመድረሻ አድራሻ</div>
        <div class="form-row">
          <div class="form-group">
            <label>ብሎክ</label>
            <input type="text" id="block" placeholder="ምሳሌ፦ 45" required>
          </div>
          <div class="form-group">
            <label>ደረጃ</label>
            <input type="text" id="floor" placeholder="ምሳሌ፦ 3" required>
          </div>
          <div class="form-group">
            <label>የቤት ቁጥር</label>
            <input type="text" id="houseNo" placeholder="ምሳሌ፦ 909" required>
          </div>
        </div>
        <div class="form-group">
          <label>ስልክ ቁጥር</label>
          <input type="tel" id="phone" placeholder="ምሳሌ፦ 0911223344" required>
        </div>
      </div>

      <div class="card">
        <div class="card-title">⏰ ሰዓት እና የክፍያ አማራጭ</div>
        <div class="form-group">
          <label>ለስንት ሰዓት ይድረስልዎ?</label>
          <select id="deliveryTime" required>
            <option value="በጣም አጣዳፊ (በ15-20 ደቂቃ ውስጥ)">በጣም አጣዳፊ (በ15-20 ደቂቃ ውስጥ)</option>
            <option value="በ1 ሰዓት ውስጥ">በ1 ሰዓት ውስጥ</option>
            <option value="ከሰዓት (ከቀኑ 8:00 - 10:00)">ከሰዓት (ከቀኑ 8:00 - 10:00)</option>
            <option value="ምሽት (ከምሽቱ 12:00 - 2:00)">ምሽት (ከምሽቱ 12:00 - 2:00)</option>
          </select>
        </div>
        <div class="form-group">
          <label>በምን ይከፍላሉ?</label>
          <select id="paymentMethod" required>
            <option value="ቴሌብር (Telebirr)">ቴሌብር (Telebirr)</option>
            <option value="ሲቢኢ ብር (CBE Birr)">ሲቢኢ ብር (CBE Birr)</option>
            <option value="እጅ በእጅ (Cash on Delivery)">እጅ በእጅ (Cash on Delivery)</option>
          </select>
        </div>
        <div class="form-group">
          <label>ተጨማሪ አስተያየት</label>
          <input type="text" id="notes" placeholder="ምሳሌ፦ ካውንተር ጋር ደውሉልኝ...">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">ትዕዛዙን ላክ 🚀</button>
      <div id="statusMessage"></div>
    </form>
  </div>

  <script>
    const CONFIG = {
      botToken: "8516306659:AAFh9eIW6Kw6jb7j-okK-SjfqGlBNla_3eM",
      chatId: "1230396565"
    };

    const dailyItems = [
      { name: "እንጀራ", price: "30 ብር", icon: "🫓" },
      { name: "ዳቦ", price: "12 ብር", icon: "🍞" },
      { name: "ስኳር", price: "200 ብር", icon: "🍬" },
      { name: "ለስላሳ", price: "120 ብር", icon: "🥤" },
      { name: "ጃኖ 20ሌትር", price: "200 ብር", icon: "💧" },
      { name: "ከሰል", price: "600 ብር", icon: "🪵" },
      { name: "ምስር", price: "380 ብር", icon: "🍲" },
      { name: "ዳይፐር", price: "600 ብር", icon: "👶" },
      { name: "ሳሙና", price: "100-250 ብር", icon: "🧼" }
    ];

    const grid = document.getElementById('productGrid');
    grid.innerHTML = dailyItems.map(item => `
      <div class="product-card">
        <div class="product-top">
          <div class="product-icon">${item.icon}</div>
          <div class="product-info">
            <div class="product-name">${item.name}</div>
            <div class="product-price">${item.price}</div>
          </div>
        </div>
        <button type="button" class="btn-quick-add" onclick="quickAddItem('${item.name}', '${item.price}')">
          + ወደ ማዘዣው ጨምር
        </button>
      </div>
    `).join('');

    function quickAddItem(name, price) {
      const itemsInput = document.getElementById('items');
      itemsInput.value = itemsInput.value ? `${itemsInput.value}፣ ${name} (${price})` : `${name} (${price})`;
      itemsInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
      itemsInput.focus();
    }

    async function handleOrder(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMessage');

      const items = document.getElementById('items').value.trim();
      const quantity = document.getElementById('quantity').value.trim();
      const price = document.getElementById('estimatedPrice').value.trim() || "ያልተገለጸ";
      const block = document.getElementById('block').value.trim();
      const floor = document.getElementById('floor').value.trim();
      const houseNo = document.getElementById('houseNo').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const deliveryTime = document.getElementById('deliveryTime').value;
      const paymentMethod = document.getElementById('paymentMethod').value;
      const notes = document.getElementById('notes').value.trim();

      submitBtn.disabled = true;
      submitBtn.innerText = "በመላክ ላይ... ⏳";

      let text = `🛒 *አዲስ ትዕዛዝ ደርሶዎታል!*\n\n`;
      text += `📦 *እቃ:* ${items}\n`;
      text += `🔢 *ብዛት:* ${quantity}\n`;
      text += `💰 *ዋጋ:* ${price}\n\n`;
      text += `📍 *አድራሻ:*\n• ብሎክ: ${block}\n• ደረጃ: ${floor}\n• የቤት ቁጥር: ${houseNo}\n`;
      text += `📞 *ስልክ:* ${phone}\n\n`;
      text += `⏰ *የሚደርስበት ሰዓት:* ${deliveryTime}\n`;
      text += `💳 *የክፍያ መንገድ:* ${paymentMethod}\n`;
      if (notes) text += `💬 *ማስታወሻ:* ${notes}\n`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${CONFIG.botToken}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CONFIG.chatId,
            text: text,
            parse_mode: 'Markdown'
          })
        });

        if (response.ok) {
          statusMsg.style.display = "block";
          statusMsg.style.background = "#065f46";
          statusMsg.style.color = "#6ee7b7";
          statusMsg.innerText = "✅ ትዕዛዝዎ በተሳካ ሁኔታ ተልኳል! በደቂቃዎች ውስጥ ይደርስዎታል።";
          document.getElementById('orderForm').reset();
        } else {
          throw new Error('Send failed');
        }
      } catch (err) {
        statusMsg.style.display = "block";
        statusMsg.style.background = "#7f1d1d";
        statusMsg.style.color = "#fca5a5";
        statusMsg.innerText = "❌ ትዕዛዙ አልተላከም፤ እባክዎ ኢንተርኔትዎን ይፈትሹ።";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "ትዕዛዙን ላክ 🚀";
      }
    }
  </script>
</body>
</html>
