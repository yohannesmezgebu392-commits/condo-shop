<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የኮንዶሚኒየም ፈጣን ማዘዣ</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 50px; }

    /* Header & Branding */
    header {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: white;
      padding: 24px 20px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.35);
      text-align: center;
    }
    .shop-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .shop-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: white;
      border: 2px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 { font-size: 1.35rem; font-weight: 800; }
    header p { font-size: 0.85rem; opacity: 0.95; }

    .container { max-width: 520px; margin: 0 auto; padding: 18px 14px; }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 16px 0 12px 2px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #38bdf8;
    }

    /* Product Grid Showcase */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .product-card:active { transform: scale(0.97); }
    .product-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .product-icon {
      font-size: 1.8rem;
      background: var(--card-inner);
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .product-info { flex: 1; }
    .product-name { font-size: 0.9rem; font-weight: 700; line-height: 1.2; }
    .product-price { font-size: 0.85rem; color: #34d399; font-weight: 700; margin-top: 3px; }

    .btn-quick-add {
      width: 100%;
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 8px;
      padding: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* Main Order Form Cards */
    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }
    .card-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group { margin-bottom: 12px; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    input, textarea, select {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
    }

    textarea { resize: vertical; min-height: 65px; }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 5px 18px rgba(16, 185, 129, 0.4);
      margin-top: 10px;
    }
    .btn-submit:active { transform: scale(0.98); background: var(--primary-hover); }
  </style>
</head>
<body>

  <header>
    <div class="shop-brand">
      <img id="shopLogo" class="shop-logo" src="https://api.iconify.design/lucide:store.svg?color=%2310b981" alt="Logo">
      <h1 id="shopName">የኮንዶሚኒየም ሱቅ</h1>
    </div>
    <p>የእለት ተእለት ፍላጎትዎን ይዘዙ፤ በደቂቃዎች ውስጥ እናደርሳለን!</p>
  </header>

  <div class="container">

    <div class="section-title">🔥 ተወዳጅ የእለት ተእለት እቃዎች (ነክተው ይጨምሩ)</div>
    <div class="product-grid" id="productGrid"></div>

    <form id="orderForm" onsubmit="handleOrder(event)">

      <div class="card">
        <div class="card-title">📝 የሚፈልጉት እቃ ዝርዝር</div>
        <div class="form-group">
          <label>የሚፈልጉት እቃ (ከላይ ሲነኩ እዚህ ይገባል ወይም በራስዎ ይጻፉ)</label>
          <textarea id="items" placeholder="ለምሳሌ፦ 10 እንጀራ፣ 1 ኪሎ ምስር..." required></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>ጠቅላላ ብዛት</label>
            <input type="text" id="quantity" placeholder="ምሳሌ፦ 10 ፍሬ / 2 ፓኬት" required>
          </div>
          <div class="form-group">
            <label>የተገመተ ዋጋ (ብር)</label>
            <input type="text" id="estimatedPrice" placeholder="ምሳሌ፦ 300 ብር">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📍 የመድረሻ አድራሻ</div>
        <div class="form-row">
          <div class="form-group">
            <label>ብሎክ</label>
            <input type="text" id="block" placeholder="ምሳሌ፦ 45" required>
          </div>
          <div class="form-group">
            <label>ደረጃ</label>
            <input type="text" id="floor" placeholder="ምሳሌ፦ 3" required>
          </div>
          <div class="form-group">
            <label>የቤት ቁጥር</label>
            <input type="text" id="houseNo" placeholder="ምሳሌ፦ 909" required>
          </div>
        </div>
        <div class="form-group">
          <label>ስልክ ቁጥር</label>
          <input type="tel" id="phone" placeholder="ምሳሌ፦ 0911223344" required>
        </div>
      </div>

      <div class="card">
        <div class="card-title">⏰ ሰዓት እና የክፍያ አማራጭ</div>
        <div class="form-group">
          <label>ለስንት ሰዓት ይድረስልዎ?</label>
          <select id="deliveryTime" required>
            <option value="በጣም አጣዳፊ (በ15-20 ደቂቃ ውስጥ)">በጣም አጣዳፊ (በ15-20 ደቂቃ ውስጥ)</option>
            <option value="በ1 ሰዓት ውስጥ">በ1 ሰዓት ውስጥ</option>
            <option value="ከሰዓት (ከቀኑ 8:00 - 10:00)">ከሰዓት (ከቀኑ 8:00 - 10:00)</option>
            <option value="ምሽት (ከምሽቱ 12:00 - 2:00)">ምሽት (ከምሽቱ 12:00 - 2:00)</option>
            <option value="ነገ ጠዋት (ከጠዋቱ 1:00 - 3:00)">ነገ ጠዋት (ከጠዋቱ 1:00 - 3:00)</option>
          </select>
        </div>

        <div class="form-group">
          <label>በምን ይከፍላሉ?</label>
          <select id="paymentMethod" required>
            <option value="ቴሌብር (Telebirr)">ቴሌብር (Telebirr)</option>
            <option value="ሲቢኢ ብር (CBE Birr)">ሲቢኢ ብር (CBE Birr)</option>
            <option value="እጅ በእጅ (Cash on Delivery)">እጅ በእጅ (Cash on Delivery)</option>
          </select>
        </div>

        <div class="form-group">
          <label>ተጨማሪ አስተያየት (ካለዎት)</label>
          <input type="text" id="notes" placeholder="ምሳሌ፦ ካውንተር ጋር ደውሉልኝ...">
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <span>ትዕዛዙን በቴሌግራም ላክ</span> 🚀
      </button>

    </form>
  </div>

  <script>
    const SHOP_CONFIG = {
      name: "የኮንዶሚኒየም ሱቅ",
      logoUrl: "https://api.iconify.design/lucide:store.svg?color=%2310b981",
      telegramUsername: "my_condo_delivery_bot"
    };

    document.getElementById('shopName').innerText = SHOP_CONFIG.name;
    document.getElementById('shopLogo').src = SHOP_CONFIG.logoUrl;

    const dailyItems = [
      { name: "እንጀራ", price: "30 ብር", icon: "🫓" },
      { name: "ዳቦ", price: "12 ብር", icon: "🍞" },
      { name: "ስኳር", price: "200 ብር", icon: "🍬" },
      { name: "ለስላሳ", price: "120 ብር", icon: "🥤" },
      { name: "ጃኖ 20ሌትር", price: "200 ብር", icon: "💧" },
      { name: "ከሰል", price: "600 ብር", icon: "🪵" },
      { name: "ምስር", price: "380 ብር", icon: "🍲" },
      { name: "ዳይፐር", price: "600 ብር", icon: "👶" },
      { name: "ሳሙና", price: "100-250 ብር", icon: "🧼" },
      { name: "የገላ ሳሙና", price: "100-300 ብር", icon: "🚿" },
      { name: "ሽቶ", price: "750-1200 ብር", icon: "✨" },
      { name: "ደብተር", price: "60-100 ብር", icon: "📓" },
      { name: "ቸኮሌት", price: "50-150 ብር", icon: "🍫" }
    ];

    const grid = document.getElementById('productGrid');
    grid.innerHTML = dailyItems.map((item, index) => `
      <div class="product-card">
        <div class="product-top">
          <div class="product-icon">${item.icon}</div>
          <div class="product-info">
            <div class="product-name">${item.name}</div>
            <div class="product-price">${item.price}</div>
          </div>
        </div>
        <button type="button" class="btn-quick-add" onclick="quickAddItem('${item.name}', '${item.price}')">
          + ወደ ማዘዣው ጨምር
        </button>
      </div>
    `).join('');

    function quickAddItem(name, price) {
      const itemsInput = document.getElementById('items');
      if (itemsInput.value.trim() === "") {
        itemsInput.value = `${name} (${price})`;
      } else {
        itemsInput.value += `፣ ${name} (${price})`;
      }
      itemsInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
      itemsInput.focus();
    }

    function handleOrder(e) {
      e.preventDefault();

      const items = document.getElementById('items').value.trim();
      const quantity = document.getElementById('quantity').value.trim();
      const price = document.getElementById('estimatedPrice').value.trim() || "ያልተገለጸ";
      const block = document.getElementById('block').value.trim();
      const floor = document.getElementById('floor').value.trim();
      const houseNo = document.getElementById('houseNo').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const deliveryTime = document.getElementById('deliveryTime').value;
      const paymentMethod = document.getElementById('paymentMethod').value;
      const notes = document.getElementById('notes').value.trim();

      let orderSummary = `አዲስ_ትዕዛዝ__ዕቃ_${items}__ብዛት_${quantity}__ዋጋ_${price}__አድራሻ_ብሎክ${block}_ደረጃ${floor}_ቤት${houseNo}__ስልክ_${phone}__ሰዓት_${deliveryTime}__ክፍያ_${paymentMethod}`;
      if (notes) {
        orderSummary += `__ማስታወሻ_${notes}`;
      }

      // ክፍተቶችንና ልዩ ምልክቶችን ለሊንክ በሚመች መልኩ ማስተካከል
      const cleanParam = encodeURIComponent(orderSummary.replace(/\s+/g, '_'));

      // ብሮውዘርም ሆነ ስልክ በቀጥታ እንዲከፍተው የሚሰራ ዩአርኤል
      const telegramUrl = `https://telegram.me/${SHOP_CONFIG.telegramUsername}?start=${cleanParam}`;

      // በ Chrome ወይም ውጫዊ ብሮውዘር ላይ መክፈት
      window.location.href = telegramUrl;
    }
  </script>
</body>
</html>
